<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Ahmad Hidayat</title>
    <link rel="stylesheet" type="text/css" href="Tugas3.css">
</head>
<body>
    <div id="header">
        <h1>Ahmad Hidayat</h1>
        <div class="menu">
            <a href="#profil">Profil</a>
            <a href="#jadwal">Jadwal Kuliah</a>
            <a href="#form">Form</a>
        </div>
    </div>

    <div id="content">
        <div class="box" id="profil">
            <h2>Data Diri</h2>
            <p>Nama: Ahmad Hidayat</p>
            <p>Program Studi: D3 Teknologi Komputer</p>
            <p>Universitas: Telkom University</p>
        </div>

        <div class="box" id="jadwal">
            <h2>Jadwal Kuliah</h2>
            <table border="1">
                <tr>
                    <th>Hari</th>
                    <th>Mata Kuliah</th>
                    <th>Jam</th>
                </tr>
                <tr>
                    <td>Rabu</td>
                    <td>Pemrograman Web</td>
                    <td>15.30 - 18.30</td>
                </tr>
            </table>
        </div>

        <div class="box" id="form">
            <h2>Form Input</h2>
            <form>
                <label>Nama:</label><br>
                <input type="text" name="nama"><br>
                <label>NIM:</label><br>
                <input type="email" name="nim"><br>
                <label>Prodi:</label><br>
                <textarea name="prodi"></textarea><br>
                <input type="submit" value="Kirim">
            </form>
        </div>
    </div>

    <div id="footer">
        <p>&copy; 2026 Ahmad Hidayat</p>
    </div>
</body>
</html>
