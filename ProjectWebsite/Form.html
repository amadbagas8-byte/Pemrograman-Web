<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - Tani Makmur</title>
    <link rel="stylesheet" href="Project.css">
</head>
<body>
    <section class="halaman">
        <div class="form-wadah">
            <h2>Form Penjualan</h2>

            <form id="formKontak">
                <div class="form-grup">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan nama">
                    <span class="error" id="errorNama"></span>
                </div>

                <div class="form-grup">
                    <label for="email">Email</label>
                    <input type="text" id="email" placeholder="contoh@email.com">
                    <span class="error" id="errorEmail"></span>
                </div>

                <div class="form-grup">
                    <label for="telepon">Pemesanan</label>
                    <input type="text" id="telepon" placeholder="08xxxxxxxxxx">
                    <span class="error" id="errorTelepon"></span>
                </div>

                <div class="form-grup">
                    <label for="pesan">Pesan</label>
                    <textarea id="pesan" rows="4" placeholder="Tulis pesan Anda"></textarea>
                    <span class="error" id="errorPesan"></span>
                </div>

                <button type="submit" class="tombol-kirim">Kirim</button>
            </form>
        </div>
    </section>
    <script src="Form.js"></script>
</body>
</html>
